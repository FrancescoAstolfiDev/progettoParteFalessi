name: SonarCloud Manual Analysis

on:
  workflow_dispatch:  # ⬅️ Abilita il bottone "Run workflow" su GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./My_ispw2_Project  # ← Update this if incorrect

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Build and analyze
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=org.example:My_Ispw2_Project_Falessi \
          -Dsonar.organization=org-example \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

